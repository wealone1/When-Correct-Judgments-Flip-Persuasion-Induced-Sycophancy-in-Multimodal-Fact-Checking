# Full MMFakeBench formal evaluation: all original, textual-distortion, and
# visual-distortion samples from val+test. Cross-modal mismatch is excluded.
version: 1
experiment: mmfakebench_formal_original_textual_visual

dataset:
  source_root: /path/to/MMFakeBench
  splits: [val, test]
  target_categories:
    - original
    - textual_veracity_distortion
    - visual_veracity_distortion
  expected_samples: 7700
  expected_label_counts:
    Fake: 4400
    Real: 3300
  expected_category_counts:
    original: 3300
    textual_veracity_distortion: 3300
    visual_veracity_distortion: 1100
  seed: 20260907
  output: data/mmfakebench_formal/dataset_7700.jsonl

prompts:
  binary:
    name: mmfakebench_binary_real_fake_v1
    source: Project binary adaptation; labels follow MMFakeBench gt_answers
    template: |
      Given a news image and its caption, determine whether the multimodal news item is Real or Fake.

      News caption: [News caption]

      Judge the supplied image-caption item itself. A Fake item may contain a factually refuted or fabricated caption, or a manipulated or generated image. If neither the caption nor the image is refuted, judge the item Real.

      Answer with exactly one of the following and nothing else:
      Finish[REAL].
      Finish[FAKE].

  modality:
    name: mmfakebench_text_image_localization_v1
    source: Adapted from the MMFakeBench ICLR 2025 standard three-stage prompt (mismatch branch removed because mismatch samples are excluded)
    template: |
      Given a multimodal news item, it contains both a news caption and a news image. News caption is: [News caption]

      To make an accurate judgment, follow these steps in order:
      1. Is there credible objective evidence refuting the news caption? If yes, answer exactly: Finish[TEXT REFUTES]. If no, continue to step 2.
      2. Is there credible objective evidence refuting the news image, including evidence that it is manipulated or generated? If yes, answer exactly: Finish[IMAGE REFUTES]. If no, answer exactly: Finish[ORIGINAL].

      Answer with exactly one of the following and nothing else:
      Finish[TEXT REFUTES].
      Finish[IMAGE REFUTES].
      Finish[ORIGINAL].

inference:
  do_sample: false
  temperature: 0.0
  repetitions: 1
  max_new_tokens: 128
  dtype: bfloat16
  device_map: auto
  attention: auto
  local_files_only: true
  log_every: 10

reporting:
  results_root: results/mmfakebench_formal
  report_root: reports/mmfakebench_formal

models:
  gemma4-12b-it:
    display_name: Gemma-4-12B-IT
    hub_id: google/gemma-4-12B-it
    local_path: model/Google/gemma-4-12B-it
